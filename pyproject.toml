[project]
name = "ogm-to-parquet"
version = "0.1.0"
description = "Convert OpenGeoMetadata JSON to Parquet format"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=18.0.0",
    "shapely>=2.0.0",
    "geojson>=3.0.0",
    "model2vec>=0.3.0",
]

[project.scripts]
ogm-harvest = "ogm_to_parquet.harvest:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]
distill = [
    "torch>=2.0.0",
    "sentence-transformers>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=src/ogm_to_parquet --cov-report=term-missing --cov-report=html"

[tool.hatch.build.targets.wheel]
packages = ["src/ogm_to_parquet"]

[tool.coverage.run]
source = ["src/ogm_to_parquet"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without explicit strict parameter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "F841"]  # Allow unused variables in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
