name: Build Parquet

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  build:
    name: Build cloud.parquet
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Install DuckDB CLI
        run: |
          curl -L https://github.com/duckdb/duckdb/releases/download/v1.4.4/duckdb_cli-linux-amd64.zip -o duckdb.zip
          unzip duckdb.zip
          chmod +x duckdb
          sudo mv duckdb /usr/local/bin/

      - name: Run harvest
        run: ./harvest.sh

      - name: Upload cloud.parquet artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-parquet
          path: tmp/cloud.parquet
          retention-days: 1

      - name: Upload embeddings artifact
        uses: actions/upload-artifact@v4
        with:
          name: embeddings
          path: tmp/ogm-model/embeddings.bin
          retention-days: 1

      - name: Upload tokenizer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenizer
          path: tmp/ogm-model/tokenizer.json
          retention-days: 1
